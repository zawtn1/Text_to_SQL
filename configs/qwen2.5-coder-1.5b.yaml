# QLoRA on Qwen2.5-Coder-1.5B-Instruct. Fits one Kaggle T4 (16 GB) comfortably;
# use this to iterate quickly before moving to a bigger model.
model_name: Qwen/Qwen2.5-Coder-1.5B-Instruct
train_file: data/processed/train.jsonl
val_file: data/processed/val.jsonl
output_dir: /kaggle/working/outputs/qwen2.5-coder-1.5b-spider
max_length: 2048          # examples longer than this are truncated; check prepare_data --tokenizer stats
hub_model_id: null        # e.g. your-hf-user/qwen2.5-coder-1.5b-spider-lora (needs HF_TOKEN)

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

# Passed straight to trl.SFTConfig, so any TrainingArguments field works here.
training:
  num_train_epochs: 2
  per_device_train_batch_size: 4
  per_device_eval_batch_size: 4
  gradient_accumulation_steps: 4     # effective batch size 16
  learning_rate: 2.0e-4
  lr_scheduler_type: cosine
  warmup_steps: 50
  weight_decay: 0.0
  logging_steps: 10
  eval_strategy: steps
  eval_steps: 200
  save_strategy: steps
  save_steps: 200
  save_total_limit: 2
  report_to: none
  seed: 42
